name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (tests/, real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same default docker-compose.yml already falls back to for local dev
      # (see .env.example) — not a secret, just the ephemeral CI Postgres
      # container's password, torn down at the end of the job.
      CUE_APP_DB_PASSWORD: cue_app
      # This project's own dev strategy (CLAUDE.md's Models table) scopes
      # real Ollama to the developer's own local machine only — dev, test,
      # demo — never a remote, GPU-less CI runner (the "Architecture
      # correction" already applied to frontend/.github/workflows/ci.yml's
      # own Playwright job, post-F5). Missing here until now: app/llm/
      # config.py's LLMSettings defaults both provider roles to "ollama"
      # when these are unset, so any test exercising a real LLM call (e.g.
      # FR-LED-05's propose_supersession_candidates, wired into
      # create_commitment) silently depended on a real Ollama this runner
      # never has — found failing in CI with `httpx.ConnectError: All
      # connection attempts failed` (tests/test_parties_reliability_api.py::
      # test_segmentation_by_event_archetype, the one fixture whose two
      # commitments happen to match FR-LED-05's own candidate pre-filter).
      # FakeClient/FakeEmbeddingClient (app/llm/client.py, app/ask/
      # embeddings.py) already exist and are schema-aware for exactly this
      # call — just never wired into this workflow.
      CUE_LLM_EXTRACTION_PROVIDER: fake
      CUE_LLM_REASONING_PROVIDER: fake
      CUE_EMBED_PROVIDER: fake

    steps:
      # v4 ran on the now-deprecated Node 20 runtime; v5+ runs on Node 24.
      # actions/checkout still publishes floating major tags, unlike
      # setup-uv below, so a plain major-version pin is fine here.
      - uses: actions/checkout@v7

      - name: Install uv
        # No `with:` block: this action's only Python-version input is a
        # literal `python-version` string, not a file reference — there is
        # no python-version-file input on setup-uv (confirmed against its
        # own action.yml), so the previous attempt to pass one was silently
        # ignored by the action (a harmless but noisy "unexpected input"
        # warning on every run). Nothing to replace it with, either: `uv
        # sync` below already reads .python-version on its own, with zero
        # configuration — that's uv's native behaviour, independent of
        # anything this step does.
        #
        # Pinned to the exact patch version, not a floating major tag: as of
        # v8, setup-uv deliberately stopped publishing `@v9`/`@v9.0`-style
        # tags at all (a supply-chain-security hardening, referencing the
        # 2025 tj-actions incident in its own release notes) — only the
        # exact `v9.0.0` tag (or a pinned commit SHA, if you want to go
        # further) resolves. v7 is also where this action moved off the
        # deprecated Node 20 runtime onto Node 24.
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        # app/reports/export_pdf.py's PDF export launches a real headless
        # Chromium — `uv sync` only installs the playwright Python package,
        # not the browser binary itself, which lives outside the venv in
        # ~/.cache/ms-playwright and has to be fetched separately. A fresh
        # runner has no such cache (unlike a long-lived dev machine, which
        # is why this gap wasn't caught locally); --with-deps also installs
        # the OS-level shared libraries headless Chromium needs that
        # ubuntu-latest doesn't ship by default.
        run: uv run playwright install --with-deps chromium

      - name: Start Postgres
        # Reuses docker-compose.yml directly (not a native Actions service
        # container) so db/init/01-create-app-role.sql actually runs — that
        # init script only fires on docker-entrypoint-initdb.d, which a bare
        # postgres service container skips. --wait blocks on the healthcheck
        # in docker-compose.yml, which only reports healthy once the init
        # script has finished (the postgres image runs init scripts against a
        # throwaway server before accepting connections on the real one).
        run: docker compose up -d --wait

      - name: Install OCR/PDF system dependencies
        # pytesseract (pyproject.toml) is only a thin wrapper around the
        # `tesseract` binary — installing the Python package via `uv sync`
        # does not put the binary on PATH. ubuntu-latest ships neither
        # tesseract nor poppler's `pdftotext` by default, and the Playwright
        # install step above only pulls Chromium's own OS deps, not these.
        # chi-sim matches TesseractOCRClient's default `eng+chi_sim`
        # language pair (app/capture/media.py).
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim poppler-utils

      - name: Run pytest
        # tests/conftest.py creates and migrates cue_test itself every run —
        # no separate migration or database-creation step needed here.
        run: uv run pytest
