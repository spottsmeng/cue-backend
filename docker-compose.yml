name: cue-backend

services:
  postgres:
    # pgvector/pgvector:pg17 is postgres:17 plus the `vector` extension
    # compiled in — a drop-in replacement (same Postgres major version, same
    # data directory layout), needed from this session onward because
    # DocumentVersion.embedding (Prompt 6, FR-DOC-05's semantic-search
    # column) requires `CREATE EXTENSION vector` to exist at all. The plain
    # postgres:17 image has no path to add that extension after the fact.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cue
      POSTGRES_PASSWORD: cue
      POSTGRES_DB: cue
      # Read by db/init/01-create-app-role.sql to provision the app's
      # non-superuser runtime role (RLS is inert for a superuser connection).
      CUE_APP_DB_PASSWORD: ${CUE_APP_DB_PASSWORD:-cue_app}
    ports:
      - "5432:5432"
    volumes:
      - cue_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cue -d cue"]
      interval: 2s
      timeout: 3s
      retries: 30

  # app/documents/storage.py's StorageBackend Protocol has one real
  # implementation this session (MinioStorageBackend) — this is its local
  # dev/test target. No object store existed anywhere in this codebase
  # before Prompt 6 (confirmed: no S3/MinIO client anywhere).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cue
      MINIO_ROOT_PASSWORD: cue_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cue_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # app/foresight/worker.py's arq WorkerSettings needs a Redis-protocol
  # broker for its job queue (CUE-Tech-Stack.md §2.4: "Lightweight task
  # queue — arq (Valkey-backed)") — genuinely new infrastructure this
  # session introduces (Foresight, Prompt 7, is the first milestone that
  # needs a scheduled/background job at all; confirmed no queue/cache
  # service existed in this file before now). Same health-checked-named-
  # volume shape as postgres/minio above.
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - cue_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # app/documents/sharepoint.py's NextcloudWriteBackAdapter and
  # app/capture/adapters/nextcloud.py's NextcloudAdapter — the file_storage
  # capability's FOSS substitute for SharePoint (CUE-PRD.md §9.3a), a real
  # instance, not a sandbox pretending to be Pico's. SQLite-backed
  # (NEXTCLOUD_ADMIN_* env vars trigger the official image's unattended
  # installer on first boot) — deliberately not Postgres-backed like the
  # `postgres` service above: this container exists purely as a WebDAV
  # target for adapter testing, not a production deployment, and Nextcloud's
  # own docs only warn against SQLite under concurrent multi-user load,
  # which a single test adapter never produces.
  nextcloud:
    image: nextcloud:stable
    environment:
      NEXTCLOUD_ADMIN_USER: cue
      NEXTCLOUD_ADMIN_PASSWORD: cue_nextcloud_secret
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      # The image's entrypoint only auto-runs `occ maintenance:install`
      # (unattended setup) if a DB variable is explicitly present — even
      # for SQLite, ADMIN_USER/PASSWORD alone isn't enough; confirmed by
      # reading /entrypoint.sh inside the image.
      SQLITE_DATABASE: nextcloud
    ports:
      - "8080:80"
    volumes:
      - cue_nextcloud_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Mattermost needs its own Postgres (no SQLite support) — a dedicated
  # container rather than a second database on the `postgres` service
  # above, so this stays swappable/removable independently of CUE's own
  # schema-owning database.
  mattermost_postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: mattermost
      POSTGRES_DB: mattermost
    volumes:
      - cue_mattermost_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost -d mattermost"]
      interval: 2s
      timeout: 3s
      retries: 30

  # app/capture/adapters/mattermost.py's MattermostAdapter — the
  # team_collaboration capability's FOSS substitute for Microsoft Teams
  # (CUE-PRD.md §9.3a). No unattended-install env vars exist for Mattermost
  # itself (unlike Nextcloud) — the admin account, team, channel and bot
  # token are provisioned via `mmctl` after startup, see
  # scripts/setup_mattermost.sh.
  mattermost:
    image: mattermost/mattermost-team-edition:latest
    # No official arm64 build exists for this image (confirmed via `docker
    # manifest inspect` — amd64 only) — forced to emulate on Apple Silicon
    # via Docker Desktop's Rosetta/QEMU support. Slower than a native image,
    # acceptable for local adapter testing.
    platform: linux/amd64
    depends_on:
      mattermost_postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost:mattermost@mattermost_postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
    ports:
      - "8065:8065"
    volumes:
      - cue_mattermost_data:/mattermost/data
    # No custom healthcheck: this image has no shell/curl/wget at all
    # (confirmed — `docker exec ... sh` fails with "executable file not
    # found"), so it ships its own HEALTHCHECK
    # (`mmctl system status --local`, image-baked) — inherited as-is
    # rather than overridden with something that can't run inside it.

  # app/capture/adapters/imap_smtp.py's ImapSmtpAdapter — the email
  # capability's FOSS substitute for Outlook (CUE-PRD.md §9.3a). GreenMail
  # is a purpose-built open-source test mail server: dynamic mode accepts
  # any username/password as a real mailbox with no provisioning step, so
  # this exercises the real IMAP/SMTP protocol without docker-mailserver's
  # domain/DKIM/account-setup overhead — appropriate for adapter testing,
  # not a stand-in for a production mail stack.
  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.users=cue:cue_greenmail_secret@cue.test -Dgreenmail.hostname=0.0.0.0"
    ports:
      - "3025:3025"  # SMTP
      - "3143:3143"  # IMAP
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/3143'"]
      interval: 2s
      timeout: 3s
      retries: 30

  # NFR-OBS-01/02/03 local verification target — behind `profiles:
  # [observability]` so `docker compose up -d --wait` (pytest.yml's CI step,
  # and everyone's default local `up`) never starts this: it's opt-in via
  # `docker compose --profile observability up -d otel`, not a dependency
  # of anything else in this file.
  #
  # CUE-Tech-Stack.md §2.6 names SigNoz as "the lighter one-system-instead-
  # of-four option for a single-implementer setup" — real SigNoz is a
  # multi-container stack (ClickHouse + its own OTel Collector + query
  # service + frontend), heavier than what this session could stand up
  # *and actually verify end-to-end* in one pass. `grafana/otel-lgtm` is
  # the one this session actually ran (a single image bundling Grafana +
  # Tempo (traces) + Prometheus (metrics) + an OTel Collector) — Grafana
  # LGTM is CUE-Tech-Stack.md §2.6's other named option, chosen here
  # specifically because "verify locally" mattered more this session than
  # matching the tech-stack doc's own stated *default* preference. A real
  # deployment should still default to SigNoz per that doc; this is a
  # verification substitution, not a change to the named production
  # choice — same "genuine FOSS substitute, explicitly not a claim of
  # equivalence" posture the Mattermost/Nextcloud/GreenMail services above
  # already establish for their own production counterparts.
  otel:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3000:3000"   # Grafana UI (default admin/admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP — app/observability/otel.py's OTLPSpanExporter/OTLPMetricExporter target this
      - "3200:3200"   # Tempo query API (trace verification: curl .../api/search)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # NFR-SEC-03 local verification target — docs/secrets-openbao-migration.md's
  # KV layout/policy proven against a real (if dev-mode, in-memory,
  # unsealed-on-boot) OpenBao instance. `profiles: [observability]`, same
  # opt-in posture as `otel` above: `docker compose --profile observability
  # up -d openbao`, never part of the default `up`/CI invocation. Dev mode
  # only — root token fixed for local convenience, nothing here is a
  # credential worth protecting.
  openbao:
    image: openbao/openbao:latest
    profiles: ["observability"]
    command: ["server", "-dev", "-dev-root-token-id=cue-dev-root"]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://localhost:8200 bao status"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cue_postgres_data:
  cue_minio_data:
  cue_valkey_data:
  cue_nextcloud_data:
  cue_mattermost_postgres_data:
  cue_mattermost_data:
