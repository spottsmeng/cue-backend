[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "arq>=0.26.3",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "minio>=7.2.20",
    "msal>=1.37.0",
    "openpyxl>=3.1.5",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "playwright>=1.49.0",
    "pydantic-settings>=2.14.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Session-scoped async fixtures (owner_engine, app.core.db's module-level
# engine) create asyncpg connections bound to one event loop. Without this,
# pytest-asyncio gives each test function its own loop by default, and any
# session-scoped engine created in test 1's loop becomes unusable — "Future
# attached to a different loop" — the moment test 2 runs. Both fixtures and
# tests need to agree on loop scope for a shared engine to survive across
# tests at all.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Set before any test module is imported (pytest-env applies these ahead of
# collection), which matters here specifically because app/core/db.py creates
# its engine as a module-level singleton at import time — by the time a test
# could set os.environ itself, that engine would already be built against the
# wrong (dev) database. This is the one clean way to redirect it to cue_test
# without restructuring db.py's engine-at-import pattern, which is otherwise
# the right shape for the running app.
[tool.pytest_env]
CUE_DATABASE_URL = "postgresql+asyncpg://cue_app:cue_app@localhost:5432/cue_test"
CUE_MIGRATION_DATABASE_URL = "postgresql+asyncpg://cue:cue@localhost:5432/cue_test"
# Same reasoning as the DB URLs above, for the same reason: this suite must
# never depend on whatever a developer's own .env happens to be set to right
# now. CaptureSettings.backend defaults to "fixture" (app/capture/config.py),
# but a developer testing CUE_CAPTURE_BACKEND=live locally (real Layer A/
# Mattermost/IMAP calls) would otherwise silently leak that into every
# capture/writeback test that assumes the fixture adapter — confirmed live:
# this is exactly what happened switching to live mode for real testing.
CUE_CAPTURE_BACKEND = "fixture"
# Same reasoning again: test_layer_a_admin_api.py's own unconfigured-503
# test (app/api/layer_a_admin.py) must see Layer A as genuinely
# unconfigured regardless of a developer's local .env — found live, the
# same way the CUE_CAPTURE_BACKEND case above was: a real
# CUE_LAYERA_ADMIN_* block added to backend/.env for local live-testing
# broke that test the moment it ran against a real .env instead of this
# suite's own controlled environment. app/layer_a/poller.py's own
# real-fixture-server test (test_layer_a_poller.py) is the one place a
# real (test-server) Layer A admin API is deliberately reachable — it
# passes LayerAAdminSettings explicitly at the call site rather than
# relying on this env-derived singleton, so it's unaffected by these
# being forced empty here.
CUE_LAYERA_ADMIN_BASE_URL = ""
CUE_LAYERA_ADMIN_USERNAME = ""
CUE_LAYERA_ADMIN_PASSWORD = ""
